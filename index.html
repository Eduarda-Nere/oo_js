<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Animais</title>
    <style>
        body { 
            font-family: 'Arial', sans-serif; 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px;
            background-color: #f9f9f9;
        }
        h1 { color: #5187b3; text-align: center; }
        #output { 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        button { 
            padding: 12px 20px; 
            background: #5187b3; 
            color: white; 
            border: none; 
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            display: block;
            margin: 0 auto;
        }
        button:hover { background: #5187b3; }
        h3 { color: #333; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        p { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🐾 Animais 🐾 </h1>
    <button onclick="sobreAnimais()">Mostrar Animais</button>
    <div id="output">
        ---
    </div>
    <script src="main.js"></script>
</body>
</html>
